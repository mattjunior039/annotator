name = "easyannotate-signaling"
main = "worker.ts"
compatibility_date = "2025-01-01"
workers_dev = false

# Runs alongside the static site: only /signal on the production domain is routed here.
routes = [{ pattern = "easyannotate.online/signal*", zone_name = "easyannotate.online" }]

[vars]
ALLOWED_ORIGINS = "https://easyannotate.online"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SignalingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]
